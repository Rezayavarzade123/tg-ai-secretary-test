<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Secretary · control panel</title>
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --panel2: #1b232d; --line: #263041;
    --text: #e6edf3; --dim: #8b98a9; --accent: #4f9dff; --accent2: #2f81f7;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    padding: 7px 12px; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover { border-color: #3a475c; background: #222c38; }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 600; }
  button.primary:hover { background: #4090ff; }
  button.danger { color: #ffb4ae; border-color: #5b2b28; }
  button.danger:hover { background: #3a2320; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, textarea, select {
    background: #0b1118; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent2); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.45; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; letter-spacing: .02em; text-transform: uppercase; }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  h2 { font-size: 16px; }
  h3 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--dim); }
  .small { font-size: 12px; }

  /* layout */
  #app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 6px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #4f9dff, #7c5cff); display: grid; place-items: center;
    font-weight: 800; font-size: 14px; color: #fff;
  }
  .brand small { display: block; color: var(--dim); font-size: 11px; }
  nav button {
    width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; color: #c7d2de;
  }
  nav button:hover { background: #1b232d; }
  nav button.active { background: #1e2937; border-color: #2b3a4d; color: #fff; }
  nav .badge { margin-left: auto; background: var(--accent2); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }
  .sidebar-foot { margin-top: auto; font-size: 11px; color: var(--dim); padding: 10px 6px 0; border-top: 1px solid var(--line); }
  main { padding: 22px 26px 60px; max-width: 1120px; }
  header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  header.top h1 { font-size: 19px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px #3fb95080; }
  .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); }

  /* cards */
  .grid { display: grid; gap: 14px; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .cols-3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 17px; }
  .card h2 { margin-bottom: 4px; }
  .card .hint { color: var(--dim); font-size: 12.5px; margin: 0 0 14px; }
  .field { margin-bottom: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { min-width: 0; }
  .row.end { justify-content: flex-end; }
  .grow { flex: 1 1 200px; }

  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 12px 13px; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .stat .v { font-size: 19px; font-weight: 650; margin-top: 3px; overflow-wrap: anywhere; }
  .stat .v.small-v { font-size: 14px; font-weight: 500; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 8px 14px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent2); color: #fff; font-weight: 600; }

  .sw { position: relative; width: 42px; height: 24px; border-radius: 999px; background: #2b3544; border: 1px solid var(--line); cursor: pointer; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #93a2b5; transition: .15s; }
  .sw.on { background: #1f4f8f; border-color: var(--accent2); }
  .sw.on::after { left: 20px; background: #fff; }

  .item { border: 1px solid var(--line); border-radius: 9px; padding: 12px 13px; background: var(--panel2); margin-bottom: 10px; }
  .item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin-bottom: 7px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .tag.ok { color: #8ee29a; border-color: #2a5b33; }
  .tag.bad { color: #ffb4ae; border-color: #5b2b28; }
  .tag.warn { color: #f0cf80; border-color: #5b4a1f; }
  .quote { border-left: 2px solid #33415a; padding-left: 10px; color: #c3ccd8; margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; background: #1c2531; border: 1px solid var(--line);
    color: var(--text); padding: 11px 15px; border-radius: 9px; box-shadow: 0 8px 24px #0008; z-index: 50;
    opacity: 0; transform: translateY(8px); transition: .2s; max-width: 340px;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { border-color: #5b2b28; color: #ffb4ae; }
  .banner { border: 1px solid #5b4a1f; background: #2b2413; color: #f0cf80; border-radius: 9px; padding: 10px 13px; font-size: 13px; margin-bottom: 14px; }
  .banner.bad { border-color: #5b2b28; background: #2a1715; color: #ffb4ae; }
  .banner.info { border-color: #24405c; background: #13202e; color: #a8cdf5; }
  pre.log { background: #0b1118; border: 1px solid var(--line); border-radius: 9px; padding: 12px; max-height: 340px; overflow: auto; margin: 0; white-space: pre-wrap; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .brand { padding: 0 8px 0 0; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav button { width: auto; }
    .sidebar-foot { display: none; }
    main { padding: 16px; }
    .split { grid-template-columns: 1fr; }
  }
  #login { position: fixed; inset: 0; background: #0b0f14ee; display: none; place-items: center; z-index: 100; }
  #login.show { display: grid; }
  #login .card { width: min(420px, 92vw); }
</style>
</head>
<body>

<div id="app">
  <aside>
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <strong>Secretary</strong>
        <small id="brandSub">control panel</small>
      </div>
    </div>
    <nav>
      <button data-tab="dashboard" class="active">◎ Dashboard</button>
      <button data-tab="secretary">✉ Secretary</button>
      <button data-tab="drafts">📝 Drafts <span class="badge" id="navDrafts" hidden>0</span></button>
      <button data-tab="prompts">⌘ Prompts</button>
      <button data-tab="notes">🗒 Notes</button>
      <button data-tab="activity">◷ Activity</button>
      <button data-tab="setup">⚙ Setup</button>
    </nav>
    <div class="sidebar-foot">
      <div id="footBot" class="mono">—</div>
      <div id="footUptime">—</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <span class="pill" id="pillBot"><span class="dot"></span> <span>connecting…</span></span>
      <span class="pill" id="pillModel"><span class="dot"></span> <span>model</span></span>
      <span class="pill" id="pillPoll"><span class="dot"></span> <span>polling</span></span>
      <span style="flex:1"></span>
      <button class="ghost small" id="refreshBtn">Refresh</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="login">
  <div class="card">
    <h2>Control panel</h2>
    <p class="hint">Paste the access token printed by the bot at start-up (also in <code>bot/state/panel-token</code>), or open the URL that includes <code>?token=…</code>.</p>
    <div class="field">
      <label for="tokenInput">Access token</label>
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="panel token">
    </div>
    <button class="primary" id="loginBtn" style="width:100%">Enter</button>
    <p class="hint small" id="loginErr" style="margin:10px 0 0"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const S = {
  tab: 'dashboard',
  state: null,
  prompts: null,
  notes: [],
  drafts: [],
  activity: [],
  log: [],
  busy: false,
};

const TITLES = {
  dashboard: 'Dashboard',
  secretary: 'Secretary mode',
  drafts: 'Drafts',
  prompts: 'Prompts',
  notes: 'Notes',
  activity: 'Activity',
  setup: 'Setup',
};

// --- networking ---------------------------------------------------------------
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...options,
  });
  if (res.status === 401) {
    showLogin(true);
    throw new Error('Unauthorised — enter the panel token.');
  }
  let body = null;
  try { body = await res.json(); } catch { body = {}; }
  if (!res.ok) throw new Error(body?.error || 'Request failed (' + res.status + ')');
  return body;
}

function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; }, isError ? 6000 : 3000);
}

function showLogin(show) { $('#login').classList.toggle('show', show); }

// --- loading ------------------------------------------------------------------
async function refresh({ quiet = true } = {}) {
  try {
    S.state = await api('/api/state');
    if (S.tab === 'drafts') S.drafts = (await api('/api/drafts?status=' + (S.draftStatus || 'pending'))).drafts;
    if (S.tab === 'notes') S.notes = (await api('/api/notes')).notes;
    if (S.tab === 'prompts') S.prompts = await api('/api/prompts');
    if (S.tab === 'activity') {
      S.activity = (await api('/api/activity')).activity;
      S.log = (await api('/api/log')).log;
    }
    renderChrome();
    render();
  } catch (e) {
    if (quiet) console.warn(e);
    else toast(e.message, true);
  }
}

function renderChrome() {
  const st = S.state;
  if (!st) return;
  const bot = st.bot ? '@' + st.bot.username : 'no bot';
  $('#brandSub').textContent = bot;
  $('#footBot').textContent = bot;
  $('#footUptime').textContent = 'up ' + fmtDuration(st.uptime) + ' · ' + st.platform;
  $('#pageTitle').textContent = TITLES[S.tab] || S.tab;

  const pillBot = $('#pillBot');
  pillBot.innerHTML = '<span class="dot ' + (st.bot ? 'ok' : 'bad') + '"></span> <span>' + esc(bot) + '</span>';

  const pillModel = $('#pillModel');
  const llmOk = st.llm && st.llm.ok;
  pillModel.innerHTML = '<span class="dot ' + (llmOk ? 'ok' : 'bad') + '"></span> <span>' +
    esc((st.model.provider === 'cloud' ? 'cloud' : st.model.name) + (llmOk ? ' · ' + st.llm.ms + ' ms' : ' · offline')) + '</span>';

  const pillPoll = $('#pillPoll');
  pillPoll.innerHTML = '<span class="dot ' + (st.polling ? 'ok' : 'warn') + '"></span> <span>' +
    (st.polling ? 'polling' : 'idle') + ' · ' + (st.draftsPending || 0) + ' draft' + (st.draftsPending === 1 ? '' : 's') + '</span>';

  const badge = $('#navDrafts');
  badge.hidden = !st.draftsPending;
  badge.textContent = st.draftsPending || 0;
}

function fmtDuration(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function fmtBytes(n) {
  if (!n) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + units[i];
}
function fmtAgo(ts) {
  if (!ts) return 'never';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

// --- views --------------------------------------------------------------------
function render() {
  const view = $('#view');
  if (!S.state) { view.innerHTML = '<p class="muted">Connecting…</p>'; return; }
  const fns = { dashboard: viewDashboard, secretary: viewSecretary, drafts: viewDrafts, prompts: viewPrompts, notes: viewNotes, activity: viewActivity, setup: viewSetup };
  view.innerHTML = (fns[S.tab] || viewDashboard)();
  wire();
}

function viewDashboard() {
  const st = S.state;
  const llm = st.llm || {};
  const memUsed = st.system.mem.total - st.system.mem.free;
  const memPct = Math.round((memUsed / st.system.mem.total) * 100);
  const hottest = st.system.temps && st.system.temps[0];
  const warnings = [];
  if (!st.bot) warnings.push('The bot is not connected to Telegram. Check the token in Setup.');
  if (!st.owner.id) warnings.push('No owner set. Send <code>/claim</code> to the bot in Telegram (or set the owner id in Setup).');
  if (!llm.ok) warnings.push('The model server is offline: ' + esc(llm.error || '') + '. Start llama-server, or change its address in Setup.');

  return `
  ${warnings.map((w) => '<div class="banner bad">' + w + '</div>').join('')}
  <div class="grid cols-3">
    ${stat('Model', st.model.name || '—', true)}
    ${stat('Brain', st.model.provider === 'cloud' ? 'Ollama cloud' : 'local', true)}
    ${stat('Server', llm.ok ? 'online · ' + llm.ms + ' ms' : 'offline', true, llm.ok ? 'ok' : 'bad')}
    ${stat('Queue', st.queue.active ? 'generating' : 'idle', true, st.queue.active ? 'warn' : 'ok')}
    ${stat('Drafts waiting', String(st.draftsPending || 0), false, st.draftsPending ? 'warn' : '')}
    ${stat('Uptime', fmtDuration(st.uptime))}
    ${stat('Memory', memPct + '% used', true, memPct > 88 ? 'bad' : '')}
    ${stat('Load (1m)', String(st.system.loadavg[0]), true, st.system.loadavg[0] > st.system.cpus ? 'warn' : '')}
    ${stat(hottest ? 'Hottest sensor' : 'Temperature', hottest ? hottest.celsius + ' °C · ' + hottest.sensor : 'n/a', true, hottest && hottest.celsius > 80 ? 'bad' : '')}
  </div>

  <div class="grid cols-2" style="margin-top:14px">
    <div class="card">
      <h2>Try the model</h2>
      <p class="hint">Sends a message through the same prompt the bot uses. This is the honest test of whether the PS4 is keeping up.</p>
      <div class="field">
        <textarea id="testText" rows="2">Hello! In one short sentence, introduce yourself.</textarea>
      </div>
      <div class="row">
        <button class="primary" id="testBtn">Run test</button>
        <span class="small muted" id="testOut"></span>
      </div>
    </div>

    <div class="card">
      <h2>What is happening</h2>
      <p class="hint">Live counters since the bot started.</p>
      <div class="split">
        <div>
          <h3>Messages from you</h3>
          <div class="mono">${st.counts.message || 0} received</div>
          <h3 style="margin-top:12px">Secretary chats</h3>
          <div class="mono">${st.counts.business_message || 0} received</div>
        </div>
        <div>
          <h3>Button presses</h3>
          <div class="mono">${st.counts.callback_query || 0} handled</div>
          <h3 style="margin-top:12px">Last update</h3>
          <div class="mono">${fmtAgo(st.lastUpdateAt)}</div>
        </div>
      </div>
      ${st.lastError ? '<div class="banner bad" style="margin:14px 0 0"><strong>Last error</strong> (' + fmtAgo(st.lastErrorAt) + ')<br>' + esc(st.lastError) + '</div>' : ''}
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Machine</h2>
    <p class="hint">${esc(st.platform)} · node ${esc(st.node)} · pid ${st.pid} · state file <code>${esc(st.state.file)}</code></p>
    <div class="grid cols-3">
      ${stat('RAM', fmtBytes(memUsed) + ' / ' + fmtBytes(st.system.mem.total), true)}
      ${stat('CPUs', String(st.system.cpus), true)}
      ${stat('Load (5m / 15m)', st.system.loadavg.slice(1).join(' / '), true)}
      ${stat('State size', fmtBytes(st.state.bytes), true)}
      ${stat('Settings rows', String(st.state.counts.settings || 0), true)}
      ${stat('History rows', String(st.state.counts.history || 0), true)}
    </div>
    <div class="row end" style="margin-top:12px">
      <button id="backupBtn">Back up the database</button>
    </div>
  </div>`;
}

function stat(k, v, small = false, kind = '') {
  const color = kind === 'ok' ? 'var(--ok)' : kind === 'bad' ? 'var(--bad)' : kind === 'warn' ? 'var(--warn)' : 'inherit';
  return '<div class="stat"><div class="k">' + esc(k) + '</div>' +
    '<div class="v' + (small ? ' small-v' : '') + '" style="color:' + color + '">' + esc(v) + '</div></div>';
}

function viewSecretary() {
  const st = S.state;
  const s = st.settings || {};
  const mode = s.secretary_mode || 'draft';
  const lang = st.languages.find((l) => l.code === (s.lang || 'en')) || st.languages[0];
  const auto = (s.lang_auto || 'on') !== 'off';
  const delay = s.delay_seconds ?? 50;
  const pause = s.pause_hours ?? 4;
  const notify = (s.notify || 'on') !== 'off';
  const conns = (() => { try { return JSON.parse(s.secretary_conns || '[]').length; } catch { return 0; } })();

  return `
  ${st.bot && !conns ? '<div class="banner info">Not connected to an account yet. On your phone: <strong>Settings → Account → Chat Automation</strong>, pick this bot, and allow it to reply. Then the bot sends you a confirmation here.</div>' : ''}

  <div class="grid cols-2">
    <div class="card">
      <h2>How replies are sent</h2>
      <p class="hint">With a 1–2B model, drafts are the safe default: you see every reply before a real person does.</p>
      <div class="seg" id="modeSeg">
        <button data-mode="draft" class="${mode === 'draft' ? 'on' : ''}">📝 Draft</button>
        <button data-mode="auto" class="${mode === 'auto' ? 'on' : ''}">⚡ Auto</button>
        <button data-mode="off" class="${mode === 'off' ? 'on' : ''}">⏸ Off</button>
      </div>
      <p class="hint" style="margin-top:12px">
        <strong>Draft</strong> — the bot shows you a card in Telegram, you press Send.<br>
        <strong>Auto</strong> — it answers by itself, after the safety net in <code>lib/guard.js</code>.<br>
        <strong>Off</strong> — it never answers anyone on your account.
      </p>
      <div class="row" style="margin-top:6px">
        <span class="tag ${conns ? 'ok' : 'warn'}">${conns ? conns + ' connection' + (conns === 1 ? '' : 's') : 'no connection'}</span>
        <span class="tag">owner ${st.owner.id || '—'}</span>
      </div>
    </div>

    <div class="card">
      <h2>Language</h2>
      <p class="hint">A small model drifts between languages. Fixing the reply language makes it much more predictable.</p>
      <div class="field">
        <label for="langSel">Reply language</label>
        <select id="langSel">
          ${st.languages.map((l) => '<option value="' + l.code + '"' + (l.code === lang.code ? ' selected' : '') + '>' +
            esc(l.native + ' — ' + l.label + ' (' + l.code + ')') + '</option>').join('')}
        </select>
      </div>
      <div class="row" style="justify-content:space-between;margin-bottom:4px">
        <div>
          <div>Follow the person's language</div>
          <div class="small muted">On: reply in whatever language they write. Off: always use the language above.</div>
        </div>
        <div class="sw ${auto ? 'on' : ''}" id="langAuto"></div>
      </div>
      <p class="hint small" style="margin-top:12px">Same setting as Telegram: <code>/lang fa</code>, <code>/lang auto off</code>.</p>
    </div>
  </div>

  <div class="grid cols-2" style="margin-top:14px">
    <div class="card">
      <h2>Timing</h2>
      <p class="hint">"Breathing time": wait after a person's last message so several fragments get one answer.</p>
      <div class="field">
        <label for="delayRange">Reply delay — <span id="delayVal">${delay}</span> s</label>
        <input id="delayRange" type="range" min="0" max="300" step="5" value="${delay}">
      </div>
      <div class="field">
        <label for="pauseHours">Stay quiet after you reply yourself (hours)</label>
        <input id="pauseHours" type="number" min="0" max="168" value="${pause}">
      </div>
      <div class="row" style="justify-content:space-between">
        <div>
          <div>Copy replies to me</div>
          <div class="small muted">Every reply, plus what the safety net replaced.</div>
        </div>
        <div class="sw ${notify ? 'on' : ''}" id="notifySw"></div>
      </div>
    </div>

    <div class="card">
      <h2>What the secretary may say</h2>
      <p class="hint">The only information it is allowed to share about you (hours, how to reach you, when you are back).</p>
      <div class="field">
        <textarea id="secretaryInfo" rows="6" dir="auto" placeholder="e.g. I'm travelling until Friday. For urgent things call my office. Replies may take a day.">${esc(s.secretary_info || '')}</textarea>
      </div>
      <div class="row end">
        <button class="primary" id="saveInfoBtn">Save</button>
      </div>
    </div>
  </div>`;
}

function viewDrafts() {
  const list = S.drafts || [];
  const pending = list.filter((d) => d.status === 'pending');
  return `
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2>Drafts</h2>
        <p class="hint" style="margin:0">Suggested replies to people who wrote to your account. Nothing is sent until you press Send. The same cards appear in Telegram.</p>
      </div>
      <div class="seg" id="draftFilter">
        <button data-status="pending" class="${(S.draftStatus || 'pending') === 'pending' ? 'on' : ''}">Pending</button>
        <button data-status="sent" class="${S.draftStatus === 'sent' ? 'on' : ''}">Sent</button>
        <button data-status="ignored" class="${S.draftStatus === 'ignored' ? 'on' : ''}">Ignored</button>
      </div>
    </div>
  </div>
  ${list.length === 0 ? '<div class="card muted">Nothing here yet. When someone messages your account, the draft shows up here and in Telegram.</div>' : ''}
  ${list.map((d) => {
    const reasons = (() => { try { return JSON.parse(d.guard || '[]'); } catch { return []; } })();
    const statusTag = d.status === 'sent' ? '<span class="tag ok">sent</span>' : d.status === 'ignored' ? '<span class="tag">ignored</span>' : '<span class="tag warn">pending</span>';
    return `
    <div class="item" data-draft="${d.id}">
      <div class="meta">
        <strong style="color:var(--text)">${esc(d.name || 'Unknown')}</strong>
        <span>chat ${esc(d.chatId)}</span>
        ${statusTag}
        ${d.lang ? '<span class="tag">' + esc(d.lang) + '</span>' : ''}
        ${reasons.length ? '<span class="tag bad">guard: ' + esc(reasons.join(', ')) + '</span>' : ''}
        <span style="margin-left:auto">${fmtAgo((d.created || 0) * 1000)}</span>
      </div>
      <div class="quote" dir="auto">${esc(d.incoming)}</div>
      ${d.status === 'pending'
        ? `<textarea data-answer="${d.id}" rows="4" dir="auto">${esc(d.answer)}</textarea>
           <div class="row" style="margin-top:9px">
             <button class="primary" data-send="${d.id}">✅ Send</button>
             <button data-save="${d.id}">Save edit</button>
             <button data-regen="${d.id}">🔁 Regenerate</button>
             <button class="danger" data-ignore="${d.id}">🚫 Ignore</button>
           </div>`
        : `<div class="quote" dir="auto">${esc(d.sentText || d.answer)}</div>`}
    </div>`;
  }).join('')}`;
}

function viewPrompts() {
  const p = S.prompts;
  if (!p) return '<div class="card muted">Loading…</div>';
  return `
  <div class="banner info">The code always adds a security line first, your <code>/secretaryinfo</code> after, and the date last. Leave those to the code and write only the behaviour you want.</div>
  <div class="grid cols-2">
    ${promptCard('secretary', 'Secretary prompt', 'How the bot talks to people on your account.', p.secretary)}
    ${promptCard('bot', 'Your private chat prompt', 'How the bot talks to you.', p.bot)}
  </div>`;
}

function promptCard(mode, title, hint, data) {
  return `
  <div class="card">
    <h2>${esc(title)}</h2>
    <p class="hint">${esc(hint)}</p>
    <div class="field">
      <label>Custom prompt ${data.custom ? '<span class="tag ok" style="margin-left:6px">active</span>' : '<span class="tag">using default</span>'}</label>
      <textarea id="prompt-${mode}" rows="14" dir="auto" placeholder="${esc(data.default.slice(0, 400))}">${esc(data.custom || '')}</textarea>
    </div>
    <div class="row end">
      <button data-prompt-show="${mode}">Show default</button>
      <button class="danger" data-prompt-reset="${mode}">Reset</button>
      <button class="primary" data-prompt-save="${mode}">Save</button>
    </div>
  </div>`;
}

function viewNotes() {
  return `
  <div class="card" style="margin-bottom:14px">
    <h2>Private notes</h2>
    <p class="hint">Only used in your private chat with the bot. Never shown to anyone who messages your account.</p>
    <div class="row">
      <input id="noteInput" class="grow" placeholder="Something to remember…" dir="auto">
      <button class="primary" id="noteAdd">Add note</button>
    </div>
  </div>
  ${S.notes.length === 0 ? '<div class="card muted">No notes yet.</div>' : ''}
  ${S.notes.map((n) => `
    <div class="item">
      <div class="meta"><span>#${n.id}</span><span style="margin-left:auto">${n.created ? fmtAgo(n.created * 1000) : ''}</span></div>
      <div style="white-space:pre-wrap" dir="auto">${esc(n.text)}</div>
      <div class="row end" style="margin-top:8px"><button class="danger small" data-note-del="${n.id}">Delete</button></div>
    </div>`).join('')}`;
}

function viewActivity() {
  return `
  <div class="grid cols-2">
    <div class="card">
      <h2>Activity</h2>
      <p class="hint">Messages, drafts, guards and errors.</p>
      ${S.activity.length === 0 ? '<p class="muted">Nothing yet.</p>' : S.activity.map((a) => `
        <div class="item" style="margin-bottom:8px;padding:9px 11px">
          <div class="meta" style="margin:0 0 4px">
            <span class="tag ${a.kind === 'error' ? 'bad' : a.kind === 'blocked' ? 'warn' : a.kind === 'sent' ? 'ok' : ''}">${esc(a.kind)}</span>
            <span style="margin-left:auto">${fmtAgo(a.at * 1000)}</span>
          </div>
          <div class="small" dir="auto" style="overflow-wrap:anywhere">${esc(a.summary)}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>Runtime log</h2>
      <p class="hint">The last lines this process printed.</p>
      <pre class="log mono">${esc(S.log.map((l) => new Date(l.at).toISOString().slice(11, 19) + ' ' + l.message).join('\n')) || 'empty'}</pre>
    </div>
  </div>`;
}

function viewSetup() {
  const st = S.state;
  const s = st.settings || {};
  return `
  <div class="grid cols-2">
    <div class="card">
      <h2>Telegram</h2>
      <p class="hint">The token from @BotFather. Changing it reconnects the bot immediately.</p>
      <div class="field">
        <label for="botToken">Bot token ${st.secrets.botToken ? '<span class="tag ok" style="margin-left:6px">saved</span>' : '<span class="tag bad" style="margin-left:6px">missing</span>'}</label>
        <input id="botToken" type="password" placeholder="${st.secrets.botToken ? '•••••••• (leave empty to keep)' : '123456789:AA…'}">
      </div>
      <div class="field">
        <label for="ownerId">Owner Telegram id</label>
        <input id="ownerId" value="${esc(st.owner.id || '')}" placeholder="send /id to the bot">
      </div>
      <div class="field">
        <label for="tz">Timezone (IANA)</label>
        <input id="tz" value="${esc(s.timezone || 'Asia/Tehran')}" placeholder="Europe/London">
      </div>
      <div class="row end">
        <button id="sendTest">Send a test message</button>
        <button class="primary" id="saveTelegram">Save</button>
      </div>
    </div>

    <div class="card">
      <h2>Model server</h2>
      <p class="hint">A local OpenAI-compatible server. For llama.cpp it is <code>http://127.0.0.1:8080</code>; for Ollama <code>http://127.0.0.1:11434/v1</code>.</p>
      <div class="field">
        <label>Brain</label>
        <div class="seg" id="providerSeg">
          <button data-provider="local" class="${(s.llm_provider || 'local') === 'local' ? 'on' : ''}">Local machine</button>
          <button data-provider="cloud" class="${s.llm_provider === 'cloud' ? 'on' : ''}">Ollama cloud</button>
        </div>
      </div>
      <div class="field">
        <label for="baseUrl">Server URL</label>
        <input id="baseUrl" value="${esc(s.llm_base_url || st.model.baseUrl || '')}">
      </div>
      <div class="field">
        <label for="modelName">Model name</label>
        <input id="modelName" value="${esc(st.model.name || '')}" placeholder="qwen3-1.7b">
        <p class="hint small" style="margin:6px 0 0">llama-server serves whatever GGUF it was started with; the name is mostly a label. Ollama needs the real tag.</p>
      </div>
      <div class="field">
        <label for="apiKey">API key ${st.secrets.apiKey ? '<span class="tag ok" style="margin-left:6px">saved</span>' : '<span class="tag">not needed locally</span>'}</label>
        <input id="apiKey" type="password" placeholder="${st.secrets.apiKey ? '•••••••• (leave empty to keep)' : 'only for the cloud brain'}">
      </div>
      <div class="row end">
        <button class="primary" id="saveModel">Save</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Access to this panel</h2>
    <p class="hint">The panel is meant for your own network. Anyone who can reach this port and has the token can control the bot.</p>
    <div class="split">
      <div>
        <h3>Address</h3>
        <div class="mono">${esc(st.panelUrl || '—')}</div>
        <p class="hint small" style="margin-top:6px">Token file: <code>bot/state/panel-token</code></p>
      </div>
      <div>
        <h3>Hardening</h3>
        <p class="hint small">Keep the PS4 on your LAN, do not port-forward this port, and set <code>PANEL_TOKEN</code> in <code>bot/.env</code> if you want a fixed token.</p>
      </div>
    </div>
  </div>`;
}

// --- wiring ---------------------------------------------------------------------
function wire() {
  const st = S.state;
  if (!st) return;

  document.querySelectorAll('[data-tab]').forEach((b) => {
    b.onclick = () => {
      S.tab = b.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('active', x === b));
      refresh();
    };
  });

  const testBtn = $('#testBtn');
  if (testBtn) testBtn.onclick = async () => {
    const out = $('#testOut');
    const text = $('#testText').value;
    testBtn.disabled = true;
    out.textContent = 'generating…';
    try {
      const r = await api('/api/test-model', { method: 'POST', body: JSON.stringify({ text }) });
      out.innerHTML = r.ok
        ? '<span style="color:var(--ok)">' + esc((r.ms / 1000).toFixed(1)) + ' s</span> · ' + esc(r.answer.slice(0, 300))
        : '<span style="color:var(--bad)">' + esc(r.error) + '</span>';
    } catch (e) { out.textContent = e.message; }
    testBtn.disabled = false;
  };

  const backupBtn = $('#backupBtn');
  if (backupBtn) backupBtn.onclick = async () => {
    try { const r = await api('/api/backup', { method: 'POST' }); toast(r.file ? 'Saved to ' + r.file : 'Nothing to back up'); }
    catch (e) { toast(e.message, true); }
  };

  // secretary
  document.querySelectorAll('#modeSeg [data-mode]').forEach((b) => {
    b.onclick = async () => {
      try { await saveSettings({ secretary_mode: b.dataset.mode }, 'Reply mode set to ' + b.dataset.mode); }
      catch (e) { toast(e.message, true); }
    };
  });
  const langSel = $('#langSel');
  if (langSel) langSel.onchange = () => saveSettings({ lang: langSel.value }, 'Language saved').catch((e) => toast(e.message, true));
  const autoSw = $('#langAuto');
  if (autoSw) autoSw.onclick = () => {
    const on = !autoSw.classList.contains('on');
    saveSettings({ lang_auto: on ? 'on' : 'off' }, 'Language following ' + (on ? 'on' : 'off')).catch((e) => toast(e.message, true));
  };
  const delay = $('#delayRange');
  if (delay) {
    delay.oninput = () => { $('#delayVal').textContent = delay.value; };
    delay.onchange = () => saveSettings({ delay_seconds: delay.value }, 'Delay saved').catch((e) => toast(e.message, true));
  }
  const pause = $('#pauseHours');
  if (pause) pause.onchange = () => saveSettings({ pause_hours: pause.value }, 'Pause saved').catch((e) => toast(e.message, true));
  const notify = $('#notifySw');
  if (notify) notify.onclick = () => {
    const on = !notify.classList.contains('on');
    saveSettings({ notify: on ? 'on' : 'off' }, 'Notifications ' + (on ? 'on' : 'off')).catch((e) => toast(e.message, true));
  };
  const infoBtn = $('#saveInfoBtn');
  if (infoBtn) infoBtn.onclick = () => saveSettings({ secretary_info: $('#secretaryInfo').value }, 'Saved').catch((e) => toast(e.message, true));

  // drafts
  document.querySelectorAll('#draftFilter [data-status]').forEach((b) => {
    b.onclick = () => { S.draftStatus = b.dataset.status; refresh(); };
  });
  document.querySelectorAll('[data-send]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.send;
      const text = document.querySelector('[data-answer="' + id + '"]').value;
      b.disabled = true;
      try { await api('/api/drafts/' + id + '/send', { method: 'POST', body: JSON.stringify({ text }) }); toast('Sent ✅'); await refresh(); }
      catch (e) { toast(e.message, true); b.disabled = false; }
    };
  });
  document.querySelectorAll('[data-save]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.save;
      const text = document.querySelector('[data-answer="' + id + '"]').value;
      try { await api('/api/drafts/' + id, { method: 'PUT', body: JSON.stringify({ text }) }); toast('Draft saved'); }
      catch (e) { toast(e.message, true); }
    };
  });
  document.querySelectorAll('[data-regen]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = '🔁 thinking…';
      try { await api('/api/drafts/' + b.dataset.regen + '/regen', { method: 'POST' }); await refresh(); }
      catch (e) { toast(e.message, true); b.disabled = false; b.textContent = '🔁 Regenerate'; }
    };
  });
  document.querySelectorAll('[data-ignore]').forEach((b) => {
    b.onclick = async () => {
      try { await api('/api/drafts/' + b.dataset.ignore + '/ignore', { method: 'POST' }); toast('Ignored'); await refresh(); }
      catch (e) { toast(e.message, true); }
    };
  });

  // prompts
  document.querySelectorAll('[data-prompt-save]').forEach((b) => {
    b.onclick = async () => {
      const mode = b.dataset.promptSave;
      const text = $('#prompt-' + mode).value;
      try { await api('/api/prompts', { method: 'POST', body: JSON.stringify({ mode, text }) }); toast('Prompt saved'); await refresh(); }
      catch (e) { toast(e.message, true); }
    };
  });
  document.querySelectorAll('[data-prompt-reset]').forEach((b) => {
    b.onclick = async () => {
      const mode = b.dataset.promptReset;
      if (!confirm('Reset the ' + mode + ' prompt to the built-in default?')) return;
      try { await api('/api/prompts', { method: 'POST', body: JSON.stringify({ mode, text: '' }) }); toast('Reset'); await refresh(); }
      catch (e) { toast(e.message, true); }
    };
  });
  document.querySelectorAll('[data-prompt-show]').forEach((b) => {
    b.onclick = async () => {
      const mode = b.dataset.promptShow;
      const prompts = S.prompts || await api('/api/prompts');
      $('#prompt-' + mode).value = prompts[mode].default;
      toast('Showing the default — edit and save to make it custom');
    };
  });

  // notes
  const add = $('#noteAdd');
  if (add) add.onclick = async () => {
    const input = $('#noteInput');
    if (!input.value.trim()) return;
    try { await api('/api/notes', { method: 'POST', body: JSON.stringify({ text: input.value }) }); input.value = ''; await refresh(); }
    catch (e) { toast(e.message, true); }
  };
  document.querySelectorAll('[data-note-del]').forEach((b) => {
    b.onclick = async () => {
      try { await api('/api/notes/' + b.dataset.noteDel, { method: 'DELETE' }); await refresh(); }
      catch (e) { toast(e.message, true); }
    };
  });

  // setup
  const provSeg = document.querySelectorAll('#providerSeg [data-provider]');
  provSeg.forEach((b) => {
    b.onclick = () => saveSettings({ llm_provider: b.dataset.provider }, 'Brain set to ' + b.dataset.provider).catch((e) => toast(e.message, true));
  });
  const saveTelegram = $('#saveTelegram');
  if (saveTelegram) saveTelegram.onclick = async () => {
    const patch = {};
    if ($('#botToken').value.trim()) patch.bot_token = $('#botToken').value.trim();
    if ($('#ownerId').value.trim()) patch.owner_id = $('#ownerId').value.trim();
    if ($('#tz').value.trim()) patch.timezone = $('#tz').value.trim();
    try { await saveSettings(patch, 'Saved'); }
    catch (e) { toast(e.message, true); }
  };
  const saveModel = $('#saveModel');
  if (saveModel) saveModel.onclick = async () => {
    const patch = { model: $('#modelName').value.trim(), llm_base_url: $('#baseUrl').value.trim() };
    if ($('#apiKey').value.trim()) patch.llm_api_key = $('#apiKey').value.trim();
    try { await saveSettings(patch, 'Model settings saved'); }
    catch (e) { toast(e.message, true); }
  };
  const sendTest = $('#sendTest');
  if (sendTest) sendTest.onclick = async () => {
    try { await api('/api/send-test', { method: 'POST' }); toast('Test message sent to your Telegram'); }
    catch (e) { toast(e.message, true); }
  };

  const refreshBtn = $('#refreshBtn');
  if (refreshBtn) refreshBtn.onclick = () => refresh({ quiet: false });
}

async function saveSettings(patch, okMessage) {
  await api('/api/settings', { method: 'POST', body: JSON.stringify({ settings: patch }) });
  toast(okMessage || 'Saved');
  await refresh();
}

// --- boot -----------------------------------------------------------------------
$('#loginBtn').onclick = async () => {
  const token = $('#tokenInput').value.trim();
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({ token }) });
    $('#loginErr').textContent = '';
    showLogin(false);
    await refresh({ quiet: false });
  } catch (e) {
    $('#loginErr').textContent = e.message;
    $('#loginErr').style.color = 'var(--bad)';
  }
};
$('#tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#loginBtn').click(); });

// Keep the dashboard live, but never overwrite a field you are typing in.
setInterval(() => {
  const editing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName);
  if (document.hidden || editing) return;
  refresh();
}, 5000);

(async () => {
  try {
    const ping = await api('/api/ping');
    if (ping.needsAuth) { showLogin(true); return; }
    await refresh({ quiet: false });
  } catch (e) {
    showLogin(true);
  }
})();
</script>
</body>
</html>
